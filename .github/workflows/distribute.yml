name: Distribute release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  distribute:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify product version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $actual = ([xml](Get-Content src/Shionji.App.WinUI/Shionji.App.WinUI.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($actual.Trim() -ne $expected -or (Get-Content version.txt).Trim() -ne $expected) { throw 'Product version and release tag differ' }
      - run: dotnet test Shionji.slnx --configuration Release
      - run: dotnet publish src/Shionji.App.WinUI/Shionji.App.WinUI.csproj -c Release -r win-x64 -o publish
      - name: Attach ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          $name = "shionji-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name
          $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') { throw 'Expected draft release not found' }
          gh release upload $env:RELEASE_TAG $name --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false
